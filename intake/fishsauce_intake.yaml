project:
  name: "Fish sauce perception (word association + IAT)"
  analyst: "XuanHP"
  date: "2026-06-06"
  domain: consumer

business_question: "How do consumers perceive traditional vs industrial fish sauce, and do associations/attitudes differ by region and user segment?"

objectives:
  - type: describe_products
    primary: true
    description: "Describe associations and attitudes by group."
  - type: compare_products
    description: "Compare traditional vs industrial product type."
  - type: characterize_clusters
    description: "Differences by region and user segment."
  - type: relate_blocks
    description: "Link word association to the attitude/IAT block."

data_collection:
  methods: [free_comment, attitude_survey, survey_UA]
  presentation_design: unknown
  balanced_design: false
  replicates: 0
  n_products: 2
  n_consumers: 295
  n_panelists: 0
  hedonic_scale: {type: other, min: 1, max: 9}
  sampling: "Convenience sample of fish-sauce users; not nationally representative."
  fieldwork_period: "2026-05"
  known_limitations:
    - "IAT d-score sign needs the block-design doc to interpret valence"
    - "Region 'Không rõ'/'Unknown' present; gender casing typo"

governance:
  anonymized: true
  consent_for_analysis: true
  decision_stakes: product_decision

data:
  file: {path: data/Word_association.xlsx, format: xlsx, sep: ";", decimal: "."}
  tables:
    - name: word_topic
      sheet: "Binary (topic)"
      layout: consumer_by_term_binary
      group_columns: [region, gender, age, user, frequency]
      blocks:
        - {name: WA_topic, lens: cata, columns: []}
    - name: iat
      sheet: "IAT"
      layout: consumer_by_attribute_paired
      group_columns: [region, gender, age, user, frequency, Version]
      blocks:
        - {name: explicit_TT, lens: hedonic, columns: [liking_TT, tasty_TT, healthy_TT, ingre_TT, protein_TT, price_TT, packaging_TT, familar_TT, popular_TT]}
        - {name: explicit_CN, lens: hedonic, columns: [liking_CN, tasty_CN, healthy_CN, ingre_CN, protein_CN, price_CN, packaging_CN, familar_CN, popular_CN]}
        - {name: implicit, lens: attitude, columns: [d_score, B4_RT, B7_RT]}
  group_recodes:
    Region3: {from: region, map: {north: "Bắc", central: "Trung", south: "Nam"}, drop: ["Không rõ", "Unknown"]}
    User2: {from: user, map: {TT: "Truyền thống", CN: "Công nghiệp"}}
